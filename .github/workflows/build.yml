name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build app (unsigned)
        run: |
          set -euo pipefail
          xcodebuild build \
            -project AcousticReference.xcodeproj \
            -scheme AcousticReference \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$(find build/Build/Products -maxdepth 2 -name '*.app' -type d | head -n 1)"
          echo "Packaging app bundle: $APP_PATH"
          test -n "$APP_PATH"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -qry AcousticReference-unsigned.ipa Payload
          ls -lh AcousticReference-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AcousticReference-unsigned-ipa
          path: AcousticReference-unsigned.ipa
          if-no-files-found: error
